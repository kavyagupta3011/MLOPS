# .github/workflows/ci.yml — component C1 (CI/CD automation, principle P1).
#
# Runs on every push/PR. Two jobs:
#   1. lint     — fast, always runs, catches obvious breakage
#   2. pipeline — runs the small-scale pipeline end to end via `dvc repro`
#                 and fails the build if regression_gate.py detects a drop
#                 in Recall@5 vs. the committed baseline.
#
# The pipeline job needs *some* dataset to run against, and the real
# DeepFashion files are gigabytes — deliberately gitignored, can never
# live in this repo (see README "Getting the dataset"). Real training
# happens on Kaggle, against the real dataset (see kaggle/README.md).
#
# For CI specifically, this uses a tiny, synthetic fixture committed
# under ci_fixture/ (see scripts/generate_ci_fixture.py — ~200KB, 12 fake
# item_ids, correctly-formatted but placeholder images). It proves every
# pipeline stage's *code path* runs correctly end to end on a real push —
# it says nothing about model quality, since the images are solid-color
# placeholders, not real clothing photos. The "Shrink params for CI" step
# below also drops epochs/seeds to the minimum so this stays fast;
# local/Kaggle runs use the real params.yaml unmodified (this only ever
# edits the CI runner's throwaway checkout, never commits back).
#
# Expect this job to take several minutes on a fresh run — it's not
# stuck, it's downloading the pretrained CLIP/BLIP/YOLO weights (~1.5GB
# combined) that every run (fixture or real) needs regardless of dataset size.

name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install ruff
      - name: Lint
        run: ruff check src/ --line-length 110

  pipeline:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Get dataset
        run: |
          mkdir -p data/raw
          cp -r ci_fixture/DeepFashionRetrieval data/raw/DeepFashionRetrieval
          echo "Copied the synthetic CI fixture (scripts/generate_ci_fixture.py) into data/raw/."
          echo "This is NOT the real dataset — see the comment at the top of this file."
      - name: Shrink params for CI
        run: |
          python -c "
          import yaml
          with open('params.yaml') as f:
              p = yaml.safe_load(f)
          # ci_fixture/ has 12 eligible item_ids — sample all of them, and
          # train for 1 epoch each so this job stays fast. Everything else
          # (arch, thresholds, fusion alphas) is left exactly as-is, so this
          # still exercises the real code paths, not a special CI mode.
          p['sampling']['n_items'] = 10
          p['sampling']['min_images_per_item'] = 2
          p['yolo']['epochs'] = 1
          p['clip']['epochs'] = 1
          p['clip']['seeds'] = [16]
          with open('params.yaml', 'w') as f:
              yaml.dump(p, f)
          print('[ci] params.yaml shrunk for the CI fixture run (not committed back).')
          "
      - name: Run pipeline (dvc repro)
        run: dvc repro
      - name: Regression gate
        run: python -m src.ci.regression_gate
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: artifacts/metrics.json
